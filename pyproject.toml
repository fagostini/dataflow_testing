[project]
authors = [{name = "Federico Agostini", email = "federico.agostini@scilifelab.se"}]
dependencies = ["panzi-json-logic>=1.0.1,<2"]
name = "dataflow_testing"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
dataflow_testing = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
dnaio = ">=1.2.4,<2"
fastavro = ">=1.12.2,<2"
jellyfish = ">=1.2.1,<2"
numpy = ">=2.5.2,<3"
polars = ">=1.44.0,<2"
regex = ">=2026.7.19,<2027"
rich = ">=15.0.0,<16"
tornado = ">=6.5.8,<7"
appdirs = ">=1.4.4,<2"
ibmcloudant = ">=0.11.10,<0.12"
loompy = ">=3.0.8,<4"
matplotlib = ">=3.11.1,<4"
networkx = ">=3.6.1,<4"
numba = ">=0.67.0,<0.68"
pandas = ">=3.0.5,<4"
pdf2image = ">=1.17.0,<2"
pillow = ">=12.3.0,<13"
reportlab = ">=5.0.1,<6"
"ruamel.yaml" = ">=0.19.1,<0.20"
watchdog = ">=6.0.0,<7"
altair-all = ">=6.2.2,<7"
